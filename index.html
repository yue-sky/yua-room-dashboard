<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://*.rakuten.co.jp https://*.r10s.jp; connect-src 'self' http://127.0.0.1:8767; object-src 'none'; base-uri 'none'"><title>今日の楽天ROOM｜ゆあ</title><link rel="stylesheet" href="style.css"></head><body>
